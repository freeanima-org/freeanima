# 可复用打包流水线：Linux standalone + Desktop Windows（Linux 交叉）+ Mobile APK
# canary / release 共用；差异由 inputs（channel、version、publish_tag、prerelease）表达。
name: Package artifacts

on:
  workflow_call:
    inputs:
      channel:
        description: release | canary | dev
        required: true
        type: string
      version:
        description: 完整版本串（如 0.9.1 或 0.9.1-canary+202607161200）
        required: true
        type: string
      ref:
        description: 构建 git ref / SHA
        required: true
        type: string
      publish_tag:
        description: 挂载产物的 Git tag
        required: true
        type: string
      prerelease:
        description: 是否标记为 Pre-release
        required: false
        type: boolean
        default: false
      make_latest:
        description: 是否设为 latest
        required: false
        type: boolean
        default: true
      release_name:
        description: GitHub Release 标题
        required: false
        type: string
        default: ""
      release_body:
        description: GitHub Release body（可含多行）
        required: false
        type: string
        default: ""
      move_tag:
        description: 是否 force-move publish_tag 到构建 SHA（canary 滚动 tag）
        required: false
        type: boolean
        default: false
    secrets:
      FREEANIMA_CI:
        required: true
      FREEANIMA_ANDROID_KEYSTORE_BASE64:
        required: true
      FREEANIMA_ANDROID_KEYSTORE_PASSWORD:
        required: true
      FREEANIMA_ANDROID_KEY_PASSWORD:
        required: true
      FREEANIMA_ANDROID_KEY_ALIAS:
        required: true

env:
  FREEANIMA_BUILD_CHANNEL: ${{ inputs.channel }}
  FREEANIMA_BUILD_VERSION: ${{ inputs.version }}
  DESKTOP_SHELL_VERSION: ${{ inputs.version }}
  DESKTOP_SHELL_BUILD_PROFILE: release

jobs:
  linux-standalone:
    name: Linux standalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home

      - name: Build Linux standalone
        run: bun run build:cli:executable

      - name: Smoke standalone (off build-machine tiktoken path)
        run: bun scripts/smoke-standalone-tiktoken.ts

      - name: Pack artifact
        run: |
          set -euo pipefail
          cd dist/anima-executable
          tar -czf ../../anima-linux-x64.tar.gz anima
          ls -lh ../../anima-linux-x64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-standalone
          path: anima-linux-x64.tar.gz
          if-no-files-found: error

  desktop-windows:
    name: Desktop Windows (Tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows cross toolchain
        run: bun scripts/install-tauri-windows-toolchain.ts --apt

      - name: 安装 companion FBX 工具
        run: bun run setup:fbx

      - name: 构建 FreeAnima Desktop Tauri Windows（Linux 交叉编译）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:tauri:windows

      - name: 收集安装包
        run: |
          set -euo pipefail
          mkdir -p dist
          installer="dist/freeanima-desktop-tauri-windows-x64-setup.exe"
          if [[ ! -f "$installer" ]]; then
            echo "missing $installer" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          cp "$installer" dist/freeanima-desktop-windows-x64-setup.exe
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-desktop-windows
          path: dist/freeanima-desktop-windows-x64-setup.exe
          if-no-files-found: error

  desktop-tauri:
    name: Desktop Tauri (target)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/shell/tauri/src-tauri

      - name: Build Tauri desktop (Linux host)
        run: bun run package:tauri

      - name: Collect bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="$(find src/app/shell/tauri/src-tauri/target/release/bundle -type f -name '*.AppImage' | head -1 || true)"
          if [[ -z "$bundle" ]]; then
            bundle="$(find src/app/shell/tauri/src-tauri/target/release/bundle -type f -name '*.deb' | head -1 || true)"
          fi
          if [[ -z "$bundle" ]]; then
            echo "No AppImage/deb found; listing bundle dir" >&2
            find src/app/shell/tauri/src-tauri/target/release/bundle -type f | head -50 >&2 || true
            exit 1
          fi
          # Release 固定文件名（deb 也拷成 .AppImage 名会误导；优先 AppImage）
          if [[ "$bundle" == *.AppImage ]]; then
            cp "$bundle" dist/freeanima-desktop-tauri-linux.AppImage
          else
            cp "$bundle" dist/freeanima-desktop-tauri-linux.AppImage
            echo "warn: used non-AppImage as AppImage artifact name: $bundle" >&2
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-desktop-tauri
          path: dist/freeanima-desktop-tauri-linux.AppImage
          if-no-files-found: error

  mobile-android:
    name: Mobile Android (Tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src/app/shell/tauri/src-tauri/gen/android/**/*.gradle*
            src/app/shell/tauri/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            bun.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cache-android-sdk

      - name: Setup Android SDK
        run: bash scripts/setup-android-sdk.sh

      - name: Install Tauri Android deps
        run: bun scripts/install-android-tauri-deps.ts --init

      - name: Build Tauri APK
        env:
          FREEANIMA_ANDROID_KEYSTORE_BASE64: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_BASE64 }}
          FREEANIMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_PASSWORD }}
          FREEANIMA_ANDROID_KEY_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEY_PASSWORD }}
          FREEANIMA_ANDROID_KEY_ALIAS: ${{ secrets.FREEANIMA_ANDROID_KEY_ALIAS }}
          FREEANIMA_ADB_INSTALL: "0"
        run: |
          set -euo pipefail
          # shellcheck source=scripts/android-env.sh
          source scripts/android-env.sh
          # shellcheck source=scripts/export-android-signing-env.sh
          source scripts/export-android-signing-env.sh
          bun run package:android
          mkdir -p dist
          cp dist/freeanima-mobile-tauri-android.apk dist/freeanima-mobile-android.apk
          ls -lh dist/freeanima-mobile-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: package-mobile-android
          path: dist/freeanima-mobile-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: [linux-standalone, desktop-windows, desktop-tauri, mobile-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.FREEANIMA_CI }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Resolve build SHA
        id: build
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move publish tag
        if: inputs.move_tag
        run: |
          set -euo pipefail
          git tag -f "${{ inputs.publish_tag }}" "${{ steps.build.outputs.sha }}"
          git push -f origin "refs/tags/${{ inputs.publish_tag }}"

      - name: Publish / update Release (set body)
        if: inputs.release_body != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.publish_tag }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          target_commitish: ${{ steps.build.outputs.sha }}
          token: ${{ secrets.FREEANIMA_CI }}
          body: ${{ inputs.release_body }}
          files: |
            artifacts/anima-linux-x64.tar.gz
            artifacts/freeanima-desktop-tauri-linux.AppImage
            artifacts/freeanima-desktop-windows-x64-setup.exe
            artifacts/freeanima-mobile-android.apk
          fail_on_unmatched_files: true

      - name: Publish / update Release (preserve body)
        if: inputs.release_body == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.publish_tag }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          target_commitish: ${{ steps.build.outputs.sha }}
          token: ${{ secrets.FREEANIMA_CI }}
          files: |
            artifacts/anima-linux-x64.tar.gz
            artifacts/freeanima-desktop-tauri-linux.AppImage
            artifacts/freeanima-desktop-windows-x64-setup.exe
            artifacts/freeanima-mobile-android.apk
          fail_on_unmatched_files: true
