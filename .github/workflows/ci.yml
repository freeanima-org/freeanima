name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    env:
      ANIMA_TEST_PG_URL: postgres://test:test@localhost:5432/test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-anima-home
      - run: just qa typecheck
      - run: just qa lint
      - name: Build Linux standalone
        run: just pack cli
      - name: Smoke standalone
        run: bun scripts/smoke-standalone-tiktoken.ts
      - run: bun scripts/run-ci-tests.ts
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: JavaScript
          label: code-coverage/bun
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/build-site
  build-app-ui:
    name: Build app-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-anima-home
      - run: just pack app-ui
  # 暂停 Blackbox E2E（commit status `freeanima/blackbox`）：不再向 freeanima-testing 发 dispatch。
  # 恢复：删除 `if: false`，取消注释下方原条件。
  blackbox-dispatch:
    name: Blackbox dispatch
    if: false
    # if: >-
    #   github.event_name == 'pull_request' &&
    #   github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pr-verify to freeanima-testing
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FREEANIMA_CI }}
          repository: freeanima-org/freeanima-testing
          event-type: pr-verify
          client-payload: |-
            {
              "sha": "${{ github.event.pull_request.head.sha }}",
              "ref": "${{ github.event.pull_request.head.ref }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "repo_full_name": "${{ github.repository }}"
            }
