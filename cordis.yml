# Habitat 启动插件树（由 @cordisjs/plugin-loader 挂载；顺序即依赖顺序）。
# 运行期输入（host/port/http hooks 等）由 serve() 通过 ctx.bootOptions 提供；
# ctx.features 由 runBootPipelineViaLoader 在根上下文挂载。
#
# 前 8 项是启动阶段（BOOT_PHASE_PLUGINS），其后是 feature 插件
# （BOOT_FEATURE_PLUGINS）：每个 Habitat route bundle 一个插件，便于按
# feature 挂载 / 热更新。
