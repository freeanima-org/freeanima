name: Companion Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: 构建模式
        required: false
        default: release
        type: choice
        options:
          - release
          - fast
      version:
        description: 版本号（如 0.6.0；留空则不改 package.json version）
        required: false
        type: string

concurrency:
  group: companion-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            artifact_slug: windows-x64
          # - label: macOS Apple Silicon
          #   runner: macos-latest
          #   platform: mac
          #   artifact_slug: macos-arm64
          #   arch: arm64
          # - label: macOS Intel
          #   runner: macos-latest
          #   platform: mac
          #   artifact_slug: macos-x64
          #   arch: x64
    permissions:
      contents: read
    env:
      COMPANION_BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'release' }}
      COMPANION_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: 构建桌面伴侣
        working-directory: satellites/companion
        env:
          COMPANION_ARCH: ${{ matrix.arch || '' }}
        run: bun build-electron.ts --platform ${{ matrix.platform }}

      - name: 收集安装包
        if: env.COMPANION_BUILD_PROFILE == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.platform }}" in
            win)
              installer="$(ls satellites/companion/release/FreeAnima-Companion-*.exe 2>/dev/null || ls satellites/companion/release/*.exe | head -1)"
              cp "$installer" dist/companion-windows-x64-setup.exe
              ;;
            mac)
              dmg="$(ls satellites/companion/release/*.dmg | head -1)"
              case "${{ matrix.artifact_slug }}" in
                macos-arm64)
                  cp "$dmg" dist/companion-macos-arm64.dmg
                  ;;
                macos-x64)
                  cp "$dmg" dist/companion-macos-x64.dmg
                  ;;
              esac
              ;;
          esac
          ls -la dist/

      - name: 上传构建产物
        if: env.COMPANION_BUILD_PROFILE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.artifact_slug }}
          path: dist/*
          if-no-files-found: error

  publish-release-assets:
    name: Attach to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
