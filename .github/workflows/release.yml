name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # cli/publish 为构建产物（gitignore），先 build 以满足 @semantic-release/npm pkgRoot 校验
      - run: bun run build:cli

      # 质量门禁由 .github/workflows/ci.yml 负责（同 push 已跑 typecheck/lint/dep-check/test）
      # 仅安装 npm CLI；勿设 registry-url——会与 @semantic-release/npm OIDC 冲突（EINVALIDNPMTOKEN）
      # 见 https://semantic-release.gitbook.io/semantic-release/recipes/ci-configurations/github-actions
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: bunx semantic-release
