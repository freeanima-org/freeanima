name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 构建的 git ref（留空则用当前触发 SHA）
        required: false
        type: string

concurrency:
  group: canary-main
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve canary version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Resolve build SHA
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve canary version
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.FREEANIMA_CI }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/resolve-canary-version.ts --github-output

  package:
    name: Package canary
    needs: resolve-version
    uses: ./.github/workflows/package-artifacts.yml
    with:
      channel: canary
      version: ${{ needs.resolve-version.outputs.version }}
      ref: ${{ needs.resolve-version.outputs.sha }}
      publish_tag: canary
      prerelease: true
      make_latest: false
      move_tag: true
      release_name: Canary
      release_body: |
        Rolling canary builds from `main`.

        version: `${{ needs.resolve-version.outputs.version }}`
        sha: `${{ needs.resolve-version.outputs.sha }}`

        - Linux standalone: `anima-linux-x64.tar.gz`
        - Desktop Windows: `freeanima-desktop-windows-x64-setup.exe`
        - Mobile Android (debug): `freeanima-mobile-android.apk`

        Channel: **canary**. Use in-app / `anima upgrade --channel canary` to follow this track.
    secrets:
      FREEANIMA_CI: ${{ secrets.FREEANIMA_CI }}
