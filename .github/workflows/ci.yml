name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    env:
      ANIMA_TEST_PG_URL: postgres://test:test@localhost:5432/test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run dep-check
      - run: bun run docs:i18n:check
      - run: bun scripts/run-ci-tests.ts
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: JavaScript
          label: code-coverage/bun
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun run build:cli
      - run: cd cli/publish && bun pm pack
  install-cli-smoke:
    name: Install CLI local smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANIMA_TEST_PG_URL: postgres://test:test@localhost:5432/test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home
      - name: 写入 database.url
        run: |
          printf '\ndatabase:\n  url: %s\n' "$ANIMA_TEST_PG_URL" >> "$FREEANIMA_HOME/config.yaml"
      - run: bun run install:cli:local
      - name: 启动服务
        run: anima service start
      - name: 等待 /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:2658/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "health check timed out"
          exit 1
      - name: 停止服务
        if: always()
        run: anima service stop || true
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/build-site
  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home
      - run: bun run build:webui
  blackbox-dispatch:
    name: Blackbox dispatch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pr-verify to freeanima-testing
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FREEANIMA_CI }}
          repository: freeanima-org/freeanima-testing
          event-type: pr-verify
          client-payload: |-
            {
              "sha": "${{ github.event.pull_request.head.sha }}",
              "ref": "${{ github.event.pull_request.head.ref }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "repo_full_name": "${{ github.repository }}"
            }
