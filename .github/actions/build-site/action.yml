name: Build site
description: po4a compile + Paraglide + Astro site build (i18n validation checks disabled; run bun run i18n:check:all manually)
runs:
  using: composite
  steps:
    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt
          /var/lib/apt/lists
        key: apt-po4a-${{ runner.os }}-${{ hashFiles('.github/actions/build-site/action.yml') }}
        restore-keys: |
          apt-po4a-${{ runner.os }}-
    - name: Install po4a
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y po4a gettext
        po4a --version | grep -E 'po4a version 0\.(6[7-9]|[7-9][0-9])\.'
    - uses: ./.github/actions/setup-bun
    - name: i18n po4a
      shell: bash
      run: bun run i18n:po4a
    - name: Compile Paraglide messages
      shell: bash
      run: bun run paraglide:compile
    - name: Astro build
      shell: bash
      run: cd site && bun run build
