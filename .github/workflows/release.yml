name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - name: Seed CI Anima home
        run: |
          mkdir -p "${{ runner.temp }}/anima-home"
          cat > "${{ runner.temp }}/anima-home/config.yaml" <<'EOF'
          llm:
            default_profile: chat
            providers:
              main:
                backend: openai_compatible
                base_url: https://api.openai.com/v1
                api_key: ci-test-key
            profiles:
              chat:
                chain:
                  - provider: main
                    model: test-model
              reflect:
                chain:
                  - provider: main
                    model: test-model
              summary:
                chain:
                  - provider: main
                    model: test-model
          EOF
          echo "FREEANIMA_HOME=${{ runner.temp }}/anima-home" >> "$GITHUB_ENV"
      - run: bun run typecheck
      - run: bun run dep-check
      - run: bun run test

      # npm Trusted Publishing：setup-node 在 GITHUB_ACTIONS 下用 OIDC 换短期 token
      # 见 https://docs.npmjs.com/trusted-publishers#for-github-actions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: bunx semantic-release
