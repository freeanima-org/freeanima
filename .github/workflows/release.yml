name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # cli/publish 为构建产物（gitignore），semantic-release prepare 也会再 build 一次
      - run: bun run build:cli

      # npm 发布走 scripts/publish-cli.sh（bunx npm@11 + OIDC）；勿用 setup-node registry-url
      # 见 https://docs.npmjs.com/trusted-publishers#for-github-actions

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: bunx semantic-release
