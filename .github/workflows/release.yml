name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # cli/publish 为构建产物（gitignore），semantic-release prepare 也会再 build 一次
      - run: bun run build:cli

      # 质量门禁由 .github/workflows/ci.yml 负责（同 push 已跑 typecheck/lint/dep-check/test）
      # npm 发布走 scripts/publish-cli.sh 原生 OIDC；勿设 registry-url（会阻断 Trusted Publishing）
      # 见 https://docs.npmjs.com/trusted-publishers#for-github-actions
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: bunx semantic-release
