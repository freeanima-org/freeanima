# 逸灵风 config.yaml — 冷启动引导（bootstrap）
# 复制到 ~/.anima/config.yaml 并根据需要修改
#
# 运行时配置（llm、compression、mcp 等）保存在 PostgreSQL（habitat_runtime_config）；
# 请在 Shell 设置 → Habitat 服务 → 服务配置 中编辑。YAML 中的运行时段会被忽略，请清理废段。
# 有 Web dist 时 Habitat 始终托管 /web/*（无需配置；源码 just pack web）。

# 生产必填：PostgreSQL 连接（也可用 env DATABASE_URL）
database:
  url: env("DATABASE_URL")
  # url: postgresql://freeanima:password@127.0.0.1:5432/freeanima

# Habitat HTTP 监听（可选，默认 127.0.0.1:2658）
# http:
#   host: 0.0.0.0
#   allowed_hosts:           # TLS SAN（host 为 0.0.0.0 时填客户端访问用的主机名/IP）
#     - feng-vm.lan
#     - 10.200.200.10
#   cors_origins:
#     - http://127.0.0.1:4173
#   tls:
#     enabled: true          # 额外监听 HTTPS :2659（HTTP :2658 不变）
#     port: 2659
#     auto: true             # 缺失 cert/key 时自动生成（优先 mkcert，fallback openssl 自签；启用 acme 时忽略）
#     # cert: ~/.anima/tls/cert.pem
#     # key: ~/.anima/tls/key.pem
#     # 可选公网域名 Let's Encrypt（HTTP-01；与局域网 mkcert 二选一优先 acme）
#     # acme:
#     #   email: you@example.com
#     #   domains:
#     #     - anima.example.com
#     #   # challenge_port: 80   # 须公网可达
#     #   # staging: false

# Redis（EventBus / 任务上下文；不可用时静默降级，可选）
# redis:
#   url: redis://127.0.0.1:6379/0

# --- 以下运行时段请通过 Shell「Habitat 服务设置」编辑；勿再写入 config.yaml ---
#
# llm / compression / memory / mcp_servers / acp_agents / embedding / worlds …
# memory.temporal_summary：时间摘要（半小时 tick、全局天/月/年、peer Redis）；见 docs/cognition/temporal-summary.md
# 消息网关：gateway / discord / weixin（见 docs/ops/message-gateway.md）
# 完整示例见仓库 git 历史中的 config.example.yaml（迁移前版本）
