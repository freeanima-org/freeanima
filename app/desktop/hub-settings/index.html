<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeAnima Hub 设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body class="settings-page">
    <main class="settings-card">
      <h1>Hub 设置</h1>
      <p class="hint">填写远程 Hub 地址与 config.yaml 中的 <code>remote_auth.token</code>。</p>
      <label class="field">
        <span>Hub 地址</span>
        <input
          id="hub-url"
          type="url"
          inputmode="url"
          autocomplete="off"
          placeholder="https://anima.example.com"
        />
      </label>
      <label class="field">
        <span>远程 Token</span>
        <input
          id="remote-auth-token"
          type="password"
          autocomplete="off"
          placeholder="与 Hub config.yaml remote_auth.token 相同"
        />
      </label>
      <p id="status" class="status" hidden></p>
      <div class="actions">
        <button type="button" id="btn-test" class="btn secondary">测试连接</button>
        <button type="button" id="btn-save" class="btn primary">保存</button>
      </div>
      <p class="footnote">
        保存后请重启 FreeAnima Desktop 使聊天室 / 管理台 / 伴侣生效。配置写入
        <code>~/.anima/shell-client.json</code>。
      </p>
    </main>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
