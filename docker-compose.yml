services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: freeanima
      POSTGRES_USER: freeanima
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeanima -d freeanima"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  freeanima:
    build: .
    image: ghcr.io/freeanima-org/freeanima:latest
    ports:
      - "${ANIMA_PORT:-2658}:2658"
    environment:
      FREEANIMA_HOME: /home/bun/.anima
      FREEANIMA_REPO_ROOT: /app
      PG_PASSWORD: ${PG_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - anima_data:/home/bun/.anima
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  anima_data:
