name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 05:23 UTC：仅 CodeQL 需要定时；Gitleaks 随 schedule 一并跑无妨
    - cron: "23 5 * * 1"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Secret scan
        run: gitleaks detect --source . --verbose --no-banner

  codeql:
    name: CodeQL
    # PR/合入已有 CI 门禁；深度扫描仅周更，避免每次 PR 重复开销
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
