name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GITHUB_TOKEN 开的 PR 不触发下游 workflow；须 PAT 以便 Release PR 跑 ci.yml（Quality；Blackbox 已暂停）
          token: ${{ secrets.FREEANIMA_CI }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-standalone:
    name: Publish Linux standalone
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home

      - run: bun run build:cli:executable

      - name: Pack Linux x64 artifact
        run: |
          cd dist/anima-executable
          tar -czf ../../anima-linux-x64.tar.gz anima
          ls -lh ../../anima-linux-x64.tar.gz

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: anima-linux-x64.tar.gz
          fail_on_unmatched_files: true
