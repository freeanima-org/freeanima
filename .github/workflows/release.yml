name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GITHUB_TOKEN 开的 PR 不触发下游 workflow；须 PAT 以便 Release PR 跑 ci.yml（Quality；Blackbox 已暂停）
          token: ${{ secrets.FREEANIMA_CI }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package-artifacts.yml
    with:
      channel: release
      # tag_name 带 v 前缀；构建侧 resolveBuildVersionFromEnv 会去掉
      version: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      publish_tag: ${{ needs.release-please.outputs.tag_name }}
      prerelease: false
      make_latest: true
      move_tag: false
      # 不传 release_body，保留 Release Please changelog
    secrets:
      FREEANIMA_CI: ${{ secrets.FREEANIMA_CI }}
