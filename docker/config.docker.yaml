# Docker Compose 用 config 模板（复制到 $FREEANIMA_HOME/config.yaml）
# ${VAR} / ${VAR:-default} 在 loadConfig 时展开

llm:
  default_profile: chat
  providers:
    main:
      backend: openai_compatible
      base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      api_key: ${OPENAI_API_KEY}
  profiles:
    chat:
      chain:
        - provider: main
          model: ${OPENAI_MODEL:-gpt-4o-mini}
    reflect:
      chain:
        - provider: main
          model: ${OPENAI_MODEL:-gpt-4o-mini}
    summary:
      chain:
        - provider: main
          model: ${OPENAI_MODEL:-gpt-4o-mini}

database:
  url: postgresql://freeanima:${PG_PASSWORD}@postgres:5432/freeanima

redis:
  host: redis
  port: 6379

compression:
  enabled: true
  max_rounds: 50
