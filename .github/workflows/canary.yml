name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 构建的 git ref（留空则用当前触发 SHA）
        required: false
        type: string

concurrency:
  group: canary-main
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve canary version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Resolve build SHA
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve canary version
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.FREEANIMA_CI }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/resolve-canary-version.ts --github-output

  package:
    name: Package canary
    needs: resolve-version
    uses: ./.github/workflows/package-artifacts.yml
    with:
      channel: canary
      version: ${{ needs.resolve-version.outputs.version }}
      ref: ${{ needs.resolve-version.outputs.sha }}
      publish_tag: canary
      prerelease: true
      make_latest: false
      move_tag: true
      release_name: Canary
      release_body: |
        Rolling canary builds from `main`.

        version: `${{ needs.resolve-version.outputs.version }}`
        sha: `${{ needs.resolve-version.outputs.sha }}`

        - Linux standalone: `anima-linux-x64.tar.gz`
        - Desktop Windows: `freeanima-desktop-windows-x64-setup.exe`
        - Mobile Android (debug): `freeanima-mobile-android.apk`
        - Browser Extension (Chrome MV3): `freeanima-browser-extension.zip`
        - Browser Extension (Firefox, maintainer self-host): `freeanima-browser-extension-firefox.xpi`

        Channel: **canary**. Use in-app / `anima upgrade --channel canary` to follow this track.
        Firefox extension auto-update (`extension@freeanima.com`): `https://freeanima.com/extension/firefox/updates.json` → this xpi.
        Changing gecko id requires uninstalling the old add-on and installing the new xpi.
    secrets:
      FREEANIMA_CI: ${{ secrets.FREEANIMA_CI }}
      FREEANIMA_ANDROID_KEYSTORE_BASE64: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_BASE64 }}
      FREEANIMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_PASSWORD }}
      FREEANIMA_ANDROID_KEY_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEY_PASSWORD }}
      FREEANIMA_ANDROID_KEY_ALIAS: ${{ secrets.FREEANIMA_ANDROID_KEY_ALIAS }}
      FREEANIMA_AMO_API_KEY: ${{ secrets.FREEANIMA_AMO_API_KEY }}
      FREEANIMA_AMO_API_SECRET: ${{ secrets.FREEANIMA_AMO_API_SECRET }}

  refresh-site:
    name: Refresh site (Firefox updates.json)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch site deploy
        env:
          GH_TOKEN: ${{ secrets.FREEANIMA_CI }}
        run: |
          set -euo pipefail
          gh workflow run site.yml --repo "${{ github.repository }}"
          echo "Dispatched site.yml to sync freeanima.com/extension/firefox/updates.json"
