name: Setup Bun
description: 安装 Bun（默认从根 package.json 的 packageManager 读取版本），可选 bun install --frozen-lockfile（含依赖缓存）
inputs:
  bun-version:
    description: Bun 版本；留空则从根 package.json 的 packageManager 读取
    required: false
    default: ""
  install:
    description: 是否运行 bun install --frozen-lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Resolve Bun version
      id: bun-version
      shell: bash
      run: |
        if [ -n "${{ inputs.bun-version }}" ]; then
          echo "version=${{ inputs.bun-version }}" >> "$GITHUB_OUTPUT"
        else
          ver=$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
        fi
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}
    - name: Cache Bun dependencies
      if: inputs.install == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '**/package.json', 'patches/**') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
