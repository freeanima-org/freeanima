name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GITHUB_TOKEN 开的 PR 不触发下游 workflow；须 PAT 以便 Release PR 跑 ci.yml（Quality + blackbox）
          token: ${{ secrets.FREEANIMA_CI }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish CLI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - run: bun run build:cli

      # npm 发布走 scripts/publish-cli.sh（bunx npm@11 + OIDC）；勿用 setup-node registry-url
      # 见 https://docs.npmjs.com/trusted-publishers#for-github-actions
      - run: bash scripts/publish-cli.sh
