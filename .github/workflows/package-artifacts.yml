# 可复用打包流水线：Linux standalone + Desktop Windows（Linux 交叉）+ Mobile APK
# canary / release 共用；差异由 inputs（channel、version、publish_tag、prerelease）表达。
name: Package artifacts

on:
  workflow_call:
    inputs:
      channel:
        description: release | canary | local
        required: true
        type: string
      version:
        description: 完整版本串（如 0.9.1 或 0.9.1-canary+202607161200）
        required: true
        type: string
      ref:
        description: 构建 git ref / SHA
        required: true
        type: string
      publish_tag:
        description: 挂载产物的 Git tag
        required: true
        type: string
      prerelease:
        description: 是否标记为 Pre-release
        required: false
        type: boolean
        default: false
      make_latest:
        description: 是否设为 latest
        required: false
        type: boolean
        default: true
      release_name:
        description: GitHub Release 标题
        required: false
        type: string
        default: ""
      release_body:
        description: GitHub Release body（可含多行）
        required: false
        type: string
        default: ""
      move_tag:
        description: 是否 force-move publish_tag 到构建 SHA（canary 滚动 tag）
        required: false
        type: boolean
        default: false
    secrets:
      FREEANIMA_CI:
        required: true
      FREEANIMA_ANDROID_KEYSTORE_BASE64:
        required: true
      FREEANIMA_ANDROID_KEYSTORE_PASSWORD:
        required: true
      FREEANIMA_ANDROID_KEY_PASSWORD:
        required: true
      FREEANIMA_ANDROID_KEY_ALIAS:
        required: true
      FREEANIMA_AMO_API_KEY:
        required: false
      FREEANIMA_AMO_API_SECRET:
        required: false

env:
  FREEANIMA_BUILD_CHANNEL: ${{ inputs.channel }}
  FREEANIMA_BUILD_VERSION: ${{ inputs.version }}
  DESKTOP_SHELL_VERSION: ${{ inputs.version }}
  DESKTOP_SHELL_BUILD_PROFILE: release

jobs:
  linux-standalone:
    name: Linux standalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-anima-home

      - name: Build Linux standalone
        run: just pack cli

      - name: Smoke standalone (off build-machine tiktoken / jieba paths)
        run: |
          bun scripts/smoke-standalone-tiktoken.ts
          bun scripts/smoke-standalone-jieba.ts

      - name: Pack artifact
        run: |
          set -euo pipefail
          ls -lh dist/anima-linux-x64*.tar.gz
          test -f dist/anima-linux-x64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-standalone
          path: |
            dist/anima-linux-x64.tar.gz
            dist/anima-linux-x64-*.tar.gz
          if-no-files-found: error

  desktop-windows:
    name: Desktop Windows (Tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo (Windows cross)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend/portal/app/tauri/src-tauri
          key: tauri-windows-xwin

      - name: Cache cargo-xwin
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.xwin
          key: cargo-xwin-${{ runner.os }}-${{ hashFiles('scripts/install-tauri-windows-toolchain.ts') }}
          restore-keys: |
            cargo-xwin-${{ runner.os }}-

      - name: Install Windows cross toolchain
        run: just install tauri-windows -- --apt

      - name: 构建 FreeAnima Desktop Tauri Windows（Linux 交叉编译）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: just pack tauri-windows

      - name: 收集安装包
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/freeanima-desktop-windows-x64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: package-desktop-windows
          path: |
            dist/freeanima-desktop-windows-x64-setup.exe
            dist/freeanima-desktop-windows-x64-*-setup.exe
          if-no-files-found: error

  desktop-tauri:
    name: Desktop Tauri (target)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend/portal/app/tauri/src-tauri
          key: tauri-linux

      - name: Build Tauri desktop (Linux host)
        run: just pack tauri-linux

      - name: Collect bundle
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/freeanima-desktop-tauri-linux.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: package-desktop-tauri
          path: |
            dist/freeanima-desktop-tauri-linux.AppImage
            dist/freeanima-desktop-tauri-linux-*.AppImage
          if-no-files-found: error

  mobile-android:
    name: Mobile Android (Tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            packages/frontend/portal/app/tauri/src-tauri/gen/android/**/*.gradle*
            packages/frontend/portal/app/tauri/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            bun.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo (Android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend/portal/app/tauri/src-tauri
          key: tauri-android

      - uses: ./.github/actions/cache-android-sdk

      - name: Setup Android SDK
        run: bash scripts/setup-android-sdk.sh

      - name: Install Tauri Android deps
        run: just install tauri-android -- --init

      - name: Build Tauri APK
        env:
          FREEANIMA_ANDROID_KEYSTORE_BASE64: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_BASE64 }}
          FREEANIMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEYSTORE_PASSWORD }}
          FREEANIMA_ANDROID_KEY_PASSWORD: ${{ secrets.FREEANIMA_ANDROID_KEY_PASSWORD }}
          FREEANIMA_ANDROID_KEY_ALIAS: ${{ secrets.FREEANIMA_ANDROID_KEY_ALIAS }}
          FREEANIMA_ADB_INSTALL: "0"
        run: |
          set -euo pipefail
          # shellcheck source=scripts/android-env.sh
          source scripts/android-env.sh
          # shellcheck source=scripts/export-android-signing-env.sh
          source scripts/export-android-signing-env.sh
          just pack tauri-android
          ls -lh dist/freeanima-mobile-android*.apk
          test -f dist/freeanima-mobile-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: package-mobile-android
          path: |
            dist/freeanima-mobile-android.apk
            dist/freeanima-mobile-android-*.apk
          if-no-files-found: error

  browser-extension-chrome:
    name: Browser Extension (Chrome MV3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just

      - name: Build & pack Chrome browser extension
        run: just pack browser-extension-chrome

      - name: Collect artifact
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/freeanima-browser-extension.zip

      - uses: actions/upload-artifact@v7
        with:
          name: package-browser-extension-chrome
          path: |
            dist/freeanima-browser-extension.zip
            dist/freeanima-browser-extension-*.zip
          if-no-files-found: error

  # 维护者 Firefox 自托管（跟 canary tip；Chrome 包不受影响）
  browser-extension-firefox:
    name: Browser Extension (Firefox)
    if: inputs.channel == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-just

      - name: Build & pack Firefox extension
        env:
          FREEANIMA_AMO_API_KEY: ${{ secrets.FREEANIMA_AMO_API_KEY }}
          FREEANIMA_AMO_API_SECRET: ${{ secrets.FREEANIMA_AMO_API_SECRET }}
        run: just pack browser-extension-firefox

      - name: Collect artifact
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/freeanima-browser-extension-firefox.xpi
          test -f dist/freeanima-browser-extension-firefox-updates.json

      - uses: actions/upload-artifact@v7
        with:
          name: package-browser-extension-firefox
          path: |
            dist/freeanima-browser-extension-firefox.xpi
            dist/freeanima-browser-extension-firefox-*.xpi
            dist/freeanima-browser-extension-firefox-updates.json
            dist/freeanima-browser-extension-firefox-updates-*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs:
      [linux-standalone, desktop-windows, desktop-tauri, mobile-android, browser-extension-chrome]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.FREEANIMA_CI }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Resolve build SHA
        id: build
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move publish tag
        if: inputs.move_tag
        run: |
          set -euo pipefail
          git tag -f "${{ inputs.publish_tag }}" "${{ steps.build.outputs.sha }}"
          git push -f origin "refs/tags/${{ inputs.publish_tag }}"

      # 滚动 tag（canary）版本化文件名每轮不同；softprops 只按同名覆盖，须先清空旧 assets
      - name: Clear previous release assets
        if: inputs.move_tag
        env:
          GH_TOKEN: ${{ secrets.FREEANIMA_CI }}
        run: |
          set -euo pipefail
          tag="${{ inputs.publish_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No existing release for $tag; skip asset cleanup"
            exit 0
          fi
          mapfile -t assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No assets on $tag; skip"
            exit 0
          fi
          for name in "${assets[@]}"; do
            echo "Deleting asset: $name"
            gh release delete-asset "$tag" "$name" --yes
          done

      - name: Publish / update Release (set body)
        if: inputs.release_body != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.publish_tag }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          target_commitish: ${{ steps.build.outputs.sha }}
          token: ${{ secrets.FREEANIMA_CI }}
          body: ${{ inputs.release_body }}
          files: |
            artifacts/anima-linux-x64.tar.gz
            artifacts/anima-linux-x64-*.tar.gz
            artifacts/freeanima-desktop-tauri-linux.AppImage
            artifacts/freeanima-desktop-tauri-linux-*.AppImage
            artifacts/freeanima-desktop-windows-x64-setup.exe
            artifacts/freeanima-desktop-windows-x64-*-setup.exe
            artifacts/freeanima-mobile-android.apk
            artifacts/freeanima-mobile-android-*.apk
            artifacts/freeanima-browser-extension.zip
            artifacts/freeanima-browser-extension-*.zip
          fail_on_unmatched_files: true

      - name: Publish / update Release (preserve body)
        if: inputs.release_body == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.publish_tag }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          target_commitish: ${{ steps.build.outputs.sha }}
          token: ${{ secrets.FREEANIMA_CI }}
          files: |
            artifacts/anima-linux-x64.tar.gz
            artifacts/anima-linux-x64-*.tar.gz
            artifacts/freeanima-desktop-tauri-linux.AppImage
            artifacts/freeanima-desktop-tauri-linux-*.AppImage
            artifacts/freeanima-desktop-windows-x64-setup.exe
            artifacts/freeanima-desktop-windows-x64-*-setup.exe
            artifacts/freeanima-mobile-android.apk
            artifacts/freeanima-mobile-android-*.apk
            artifacts/freeanima-browser-extension.zip
            artifacts/freeanima-browser-extension-*.zip
          fail_on_unmatched_files: true

  # canary 清空资产后再挂 Firefox xpi / updates.json（与主 publish 解耦，避免 release 轨缺文件）
  publish-firefox:
    name: Publish Firefox extension assets
    if: inputs.channel == 'canary'
    needs: [publish, browser-extension-firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-browser-extension-firefox
          path: artifacts

      - name: List Firefox artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.publish_tag }}
          token: ${{ secrets.FREEANIMA_CI }}
          files: |
            artifacts/freeanima-browser-extension-firefox.xpi
            artifacts/freeanima-browser-extension-firefox-*.xpi
            artifacts/freeanima-browser-extension-firefox-updates.json
            artifacts/freeanima-browser-extension-firefox-updates-*.json
          fail_on_unmatched_files: true
