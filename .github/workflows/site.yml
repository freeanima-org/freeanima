name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "messages/**"
      - "project.inlang/**"
      - "po/**"
      - "po4a.cfg"
      - "scripts/check-paraglide-messages.ts"
      - "scripts/check-po-health.ts"
      - "scripts/gen-po4a-cfg.ts"
      - "scripts/i18n-po4a.ts"
      - "scripts/messages-i18n-lib.ts"
      - ".github/actions/build-site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
