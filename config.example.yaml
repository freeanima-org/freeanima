# 逸灵风 config.yaml — 冷启动引导（bootstrap）
# 复制到 ~/.anima/config.yaml 并根据需要修改
#
# 运行时配置（llm、compression、mcp 等）保存在 PostgreSQL；
# 请在 Shell 设置 → Hub 服务 → 服务配置 中编辑，或首次启动时从本文件自动导入。

# 生产必填：PostgreSQL 连接（也可用 env DATABASE_URL）
database:
  url: env("DATABASE_URL")
  # url: postgresql://freeanima:password@127.0.0.1:5432/freeanima

# Hub HTTP 监听（可选，默认 127.0.0.1:2658）
# http:
#   host: 0.0.0.0
#   allowed_hosts:           # TLS SAN（host 为 0.0.0.0 时填客户端访问用的主机名/IP）
#     - feng-vm.lan
#     - 10.200.200.10
#   cors_origins:
#     - http://127.0.0.1:4173
#   tls:
#     enabled: true          # 额外监听 HTTPS :2659（HTTP :2658 不变；Tunnel 仍走 HTTP）
#     port: 2659
#     auto: true             # 缺失 cert/key 时自动生成（优先 mkcert，fallback openssl 自签）
#     # cert: ~/.anima/tls/cert.pem
#     # key: ~/.anima/tls/key.pem

# Redis（EventBus / 任务上下文；不可用时静默降级，可选）
# redis:
#   url: redis://127.0.0.1:6379/0

# --- 以下运行时段请通过 Shell「服务配置」或管理台查看；首次升级可从旧版完整 config.yaml 自动导入 ---
#
# llm / compression / memory / mcp_servers / acp_agents / embedding / tunnel / web / worlds …
# 完整示例见仓库 git 历史中的 config.example.yaml（迁移前版本）
