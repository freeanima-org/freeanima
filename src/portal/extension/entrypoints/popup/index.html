<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeAnima Vault</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #175ddc;
        --accent-soft: #e8f0fe;
        --border: #d0d7de;
        --danger: #cf222e;
        --row-hover: #f6f8fa;
        --tab-h: 52px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 380px;
        height: 520px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      .header-actions {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--fg);
        border-radius: 6px;
        width: 32px;
        height: 32px;
        padding: 0;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      .icon-btn:hover {
        background: var(--row-hover);
      }
      .btn {
        border: none;
        background: var(--accent);
        color: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .btn.secondary {
        background: #fff;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .main {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .main-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 14px 12px;
      }
      .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .search-wrap {
        flex: 1;
        position: relative;
      }
      .search-wrap input {
        width: 100%;
        padding: 8px 28px 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
      }
      .search-clear {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 2px 4px;
      }
      select.filter {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 6px;
        font-size: 12px;
        background: #fff;
        color: var(--fg);
        min-width: 88px;
      }
      .section-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 6px;
        font-weight: 600;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .list-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 6px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      .list-item:hover {
        background: var(--row-hover);
      }
      .list-item.matched {
        background: var(--accent-soft);
      }
      .item-main {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        text-align: left;
        cursor: pointer;
        padding: 0;
        color: inherit;
      }
      .item-title {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-sub {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
        position: relative;
      }
      .item-actions button {
        border: none;
        background: transparent;
        color: var(--muted);
        width: 28px;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      .item-actions button:hover {
        background: #fff;
        color: var(--accent);
      }
      .menu {
        position: absolute;
        right: 0;
        top: 30px;
        z-index: 20;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        min-width: 140px;
        padding: 4px;
      }
      .menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border: none;
        background: transparent;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        color: var(--fg);
      }
      .menu button:hover {
        background: var(--row-hover);
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        height: var(--tab-h);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        background: #fff;
      }
      .tab {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px;
      }
      .tab.active {
        color: var(--accent);
        font-weight: 600;
      }
      .tab .ico {
        font-size: 16px;
        line-height: 1;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin: 6px 0;
      }
      .ok {
        color: #1a7f37;
        font-size: 12px;
        margin: 6px 0;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="password"],
      .field input[type="url"],
      .field input[type="number"],
      .field select,
      .field textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      .field textarea {
        resize: vertical;
        min-height: 64px;
      }
      .input-row {
        display: flex;
        gap: 6px;
        align-items: stretch;
      }
      .input-row input {
        flex: 1;
        min-width: 0;
      }
      .uri-row {
        display: grid;
        grid-template-columns: 1fr 72px 32px;
        gap: 4px;
        margin-bottom: 6px;
        align-items: center;
      }
      .uri-row input,
      .uri-row select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
      }
      .editor-form {
        padding-bottom: 16px;
      }
      .danger-text {
        color: var(--danger);
      }
      .gen-out {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
        background: var(--row-hover);
      }
      .gen-out code {
        flex: 1;
        font-size: 13px;
        word-break: break-all;
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        font-size: 13px;
        margin: 8px 0;
      }
      .checks label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 32px 12px;
        font-size: 13px;
      }
      .badge {
        font-size: 10px;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 0 6px;
        margin-left: 6px;
      }
      .gate {
        padding: 24px 16px;
      }
      .gate h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
