appId: org.freeanima.desktop
productName: FreeAnima Desktop
artifactName: FreeAnima-Desktop-${version}.${ext}
executableName: FreeAnima-Desktop
forceCodeSigning: false
# Linux/macOS 交叉打 Windows NSIS 时优先用 UninstallerReader（见 build-electron.ts patch）；
# 若仍走 Wine 路径，1.0.1 使用 electron-builder 自带 Wine 11。
toolsets:
  wine: "1.0.1"
directories:
  output: release
  buildResources: build-resources
files:
  - electron-dist/**/*
  - vendor/**/*
  - package.json
  - electron/icons/**/*
extraResources:
  - from: build-resources/bin
    to: bin
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: electron/icons/icon.ico
  signAndEditExecutable: false
  signExecutable: false
mac:
  target:
    - dmg
  icon: electron/icons/icon.icns
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  icon: electron/icons
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
