name: Desktop Shell Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: 构建模式
        required: false
        default: release
        type: choice
        options:
          - release
          - fast
      version:
        description: 版本号（如 0.7.0；留空则使用 tag）
        required: false
        type: string

concurrency:
  group: desktop-shell-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            artifact_slug: windows-x64
    permissions:
      contents: read
    env:
      DESKTOP_SHELL_BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'release' }}
      DESKTOP_SHELL_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: 安装 companion FBX 工具
        working-directory: satellites/companion
        run: bun run setup:fbx

      - name: 构建 FreeAnima Desktop
        working-directory: app/desktop
        run: bun build-electron.ts --platform ${{ matrix.platform }}

      - name: 收集安装包
        if: env.DESKTOP_SHELL_BUILD_PROFILE == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.platform }}" in
            win)
              installer="$(ls app/desktop/release/FreeAnima-Desktop-*.exe 2>/dev/null || ls app/desktop/release/*.exe | head -1)"
              cp "$installer" dist/freeanima-desktop-windows-x64-setup.exe
              ;;
          esac
          ls -la dist/

      - name: 上传构建产物
        if: env.DESKTOP_SHELL_BUILD_PROFILE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-shell-${{ matrix.artifact_slug }}
          path: dist/*
          if-no-files-found: error

  publish-release-assets:
    name: Attach to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
