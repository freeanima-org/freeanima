name: Setup Bun
description: 安装固定版本 Bun，可选 bun install --frozen-lockfile
inputs:
  bun-version:
    description: Bun 版本（与 packageManager 对齐）
    required: false
    default: "1.3.14"
  install:
    description: 是否运行 bun install --frozen-lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
