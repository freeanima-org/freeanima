# 默认：根目录 bun test（单元测试；覆盖率用 bun test --coverage）
# 勿写 coverage = false：Bun #12216 会导致 --coverage 失效
[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = 0.6

coveragePathIgnorePatterns = [
  "**/node_modules/**",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/tests/helpers/**",
]

[serve.static]
plugins = ["bun-plugin-tailwind"]
