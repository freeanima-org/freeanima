name: TypeScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Seed CI Anima home
        run: |
          mkdir -p "${{ runner.temp }}/anima-home"
          cat > "${{ runner.temp }}/anima-home/config.yaml" <<'EOF'
          llm:
            default_profile: chat
            providers:
              main:
                backend: openai_compatible
                base_url: https://api.openai.com/v1
                api_key: ci-test-key
            profiles:
              chat:
                chain:
                  - provider: main
                    model: test-model
              reflect:
                chain:
                  - provider: main
                    model: test-model
              summary:
                chain:
                  - provider: main
                    model: test-model
          EOF
          echo "FREEANIMA_HOME=${{ runner.temp }}/anima-home" >> "$GITHUB_ENV"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run dep-check
      - run: bun run test
      - name: Install Chromium for WebView E2E
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Run E2E (WebView)
        env:
          BUN_CHROME_PATH: /usr/bin/chromium
        run: bun run test:e2e
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Secret scan
        run: gitleaks detect --source . --verbose --no-banner
