name: Setup Chromium for Bun WebView
description: 缓存 Playwright Chromium 二进制，避免每次 apt-get install
inputs:
  playwright-version:
    description: 锁定的 Playwright 版本（影响 cache key）
    required: false
    default: "1.50.1"
runs:
  using: composite
  steps:
    - name: Cache Playwright Chromium
      uses: actions/cache@v4
      id: pw-chromium
      with:
        path: ~/.cache/ms-playwright
        key: pw-chromium-${{ runner.os }}-${{ inputs.playwright-version }}

    - name: Download Chromium (cache miss)
      if: steps.pw-chromium.outputs.cache-hit != 'true'
      shell: bash
      run: bunx --bun playwright@${{ inputs.playwright-version }} install chromium

    - name: Resolve BUN_CHROME_PATH
      shell: bash
      run: |
        CHROME="$(find "$HOME/.cache/ms-playwright" -name chrome -type f 2>/dev/null | head -1)"
        if [ -z "$CHROME" ]; then
          echo "未找到 Playwright Chromium 二进制" >&2
          exit 1
        fi
        echo "BUN_CHROME_PATH=${CHROME}" >> "$GITHUB_ENV"
        "$CHROME" --version || true
