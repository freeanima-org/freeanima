appId: org.freeanima.desktop
productName: FreeAnima Desktop
artifactName: FreeAnima-Desktop-${version}.${ext}
executableName: FreeAnima-Desktop
forceCodeSigning: false
# Linux/macOS 交叉打 Windows NSIS 时优先用 UninstallerReader（见 electron-builder-linux-patch.cjs）；
# 若仍走 Wine 路径，1.0.1 使用 electron-builder 自带 Wine 11。
toolsets:
  wine: "1.0.1"
directories:
  output: release
  buildResources: build-resources
files:
  - electron-dist/**/*
  - vendor/companion/**/*
  # remote UI 默认不打包 shell-ui；DESKTOP_UI_MODE=bundled 时包含 vendor/shell-ui/**/*
  - vendor/shell-ui/**/*
  - package.json
  - electron/icons/**/*
  - "!**/*.map"
  - "!node_modules/@freeanima/**/release/**"
  - "!node_modules/@freeanima/**/dist/**"
  - "!node_modules/@freeanima/**/.tsout/**"
  - "!node_modules/@freeanima/**/.cache/**"
  - "!node_modules/@freeanima/**/build-resources/**"
  - "!node_modules/@freeanima/**/app/**"
  - "!node_modules/@freeanima/**/src/**"
  - "!node_modules/@freeanima/**/scripts/**"
  - "!node_modules/@freeanima/**/*.ts"
  - "!node_modules/@freeanima/**/tsconfig*"
  - "!node_modules/@freeanima/**/*.tsbuildinfo"
  - "!node_modules/@freeanima/**/node_modules/**"
  - "!node_modules/fbx2vrma-converter/FBX2glTF-linux-*"
  - "!node_modules/fbx2vrma-converter/FBX2glTF-darwin-*"
extraResources:
  - from: build-resources/bin
    to: bin
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: electron/icons/icon.ico
  signAndEditExecutable: false
  signExecutable: false
mac:
  target:
    - dmg
  icon: electron/icons/icon.icns
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  icon: electron/icons
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 关闭差分包；勿开 useZip（须与 differentialPackage: false 同开，否则内嵌 7z 与 nsisunz 错配）
  differentialPackage: false
  include: build-resources/installer.nsh
