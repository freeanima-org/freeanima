name: Build site
description: Astro site build via site prebuild (po4a + Paraglide); no PO/translation validation checks
runs:
  using: composite
  steps:
    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt
          /var/lib/apt/lists
        key: apt-po4a-${{ runner.os }}-${{ hashFiles('.github/actions/build-site/action.yml') }}
        restore-keys: |
          apt-po4a-${{ runner.os }}-
    - name: Install po4a
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y po4a gettext
        po4a --version | grep -E 'po4a version 0\.(6[7-9]|[7-9][0-9])\.'
    - uses: ./.github/actions/setup-bun
    - name: Cache site dependencies
      uses: actions/cache@v4
      with:
        path: site/node_modules
        key: site-bun-${{ runner.os }}-${{ hashFiles('site/bun.lock', 'site/package.json') }}
        restore-keys: |
          site-bun-${{ runner.os }}-
    - name: Install site dependencies
      shell: bash
      run: cd site && bun install --frozen-lockfile
    - name: Astro build
      shell: bash
      run: cd site && bun run build
