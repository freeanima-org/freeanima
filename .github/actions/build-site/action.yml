name: Build site
description: Astro site build（中文单站，无 po4a/Paraglide）
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bun
    - name: Cache site dependencies
      uses: actions/cache@v4
      with:
        path: site/node_modules
        key: site-bun-${{ runner.os }}-${{ hashFiles('site/bun.lock', 'site/package.json') }}
        restore-keys: |
          site-bun-${{ runner.os }}-
    - name: Install site dependencies
      shell: bash
      run: cd site && bun install --frozen-lockfile
    - name: Astro build
      shell: bash
      run: cd site && bun run build
