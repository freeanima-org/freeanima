name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-anima-home
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run dep-check
      - run: bun scripts/run-all-tests.ts --suites unit,integration
      - run: bun run coverage:cobertura
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: JavaScript
          label: code-coverage/bun
      - run: bun run coverage:check-threshold

  blackbox-dispatch:
    name: Blackbox dispatch
    needs: [quality]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pr-verify to freeanima-testing
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.TESTING_REPO_DISPATCH_PAT }}
          repository: freeanima-org/freeanima-testing
          event-type: pr-verify
          client-payload: |-
            {
              "sha": "${{ github.event.pull_request.head.sha }}",
              "ref": "${{ github.event.pull_request.head.ref }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "repo_full_name": "${{ github.repository }}"
            }
