name: Cache electron-builder
description: 缓存 Electron 与 electron-builder 工具（nsis / nsis-resources / 7zip 等），避免 CI 冷下载
runs:
  using: composite
  steps:
    - name: Cache electron + electron-builder
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: electron-builder-${{ runner.os }}-${{ hashFiles('bun.lock', 'src/app/shell/desktop/package.json', 'package.json') }}
        restore-keys: |
          electron-builder-${{ runner.os }}-
